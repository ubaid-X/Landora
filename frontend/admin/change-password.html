<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Password — Admin — Property Dealing</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link href="/frontend/shared/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar" data-navbar="admin"></div>

    <main class="page-surface">
      <div class="container-1320 d-flex justify-content-center">
        <div class="auth-wrapper">
          <div class="auth-card">
            <div class="auth-icon-circle"><i class="fa-solid fa-key"></i></div>
            <h1 class="auth-title">Change Password</h1>
            <p class="auth-subtitle">Update your admin account password.</p>

            <div
              id="formAlert"
              class="alert"
              style="display: none"
              role="alert"
            ></div>

            <form id="changePasswordForm" novalidate>
              <div class="mb-3">
                <label for="currentPassword" class="form-label"
                  >Current Password <span class="req">*</span></label
                >
                <div class="password-field">
                  <input
                    type="password"
                    class="form-control"
                    id="currentPassword"
                    autocomplete="current-password"
                  />
                  <button
                    type="button"
                    class="password-toggle"
                    data-target="currentPassword"
                    aria-label="Show password"
                  >
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="newPassword" class="form-label"
                  >New Password <span class="req">*</span></label
                >
                <div class="password-field">
                  <input
                    type="password"
                    class="form-control"
                    id="newPassword"
                    autocomplete="new-password"
                  />
                  <button
                    type="button"
                    class="password-toggle"
                    data-target="newPassword"
                    aria-label="Show password"
                  >
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
                <div class="form-text">Minimum 8 characters.</div>
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-4">
                <label for="confirmPassword" class="form-label"
                  >Confirm New Password <span class="req">*</span></label
                >
                <div class="password-field">
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    autocomplete="new-password"
                  />
                  <button
                    type="button"
                    class="password-toggle"
                    data-target="confirmPassword"
                    aria-label="Show password"
                  >
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback"></div>
              </div>

              <button
                type="submit"
                class="btn btn-primary btn-lg w-100"
                id="submitBtn"
              >
                Change Password
              </button>

              <p class="auth-footer-link text-center">
                <a href="/frontend/admin/profile.html">← Back to My Profile</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/shared/js/api.js"></script>
    <script src="/frontend/shared/js/partials.js"></script>

    <script>
      (function () {
        "use strict";

        const form = document.getElementById("changePasswordForm");
        const formAlert = document.getElementById("formAlert");
        const submitBtn = document.getElementById("submitBtn");

        const currentEl = document.getElementById("currentPassword");
        const newEl = document.getElementById("newPassword");
        const confirmEl = document.getElementById("confirmPassword");

        document.querySelectorAll(".password-toggle").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const id = btn.getAttribute("data-target");
            const input = document.getElementById(id);
            if (!input) return;
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            const icon = btn.querySelector("i");
            if (icon)
              icon.className = isPassword
                ? "fa-regular fa-eye-slash"
                : "fa-regular fa-eye";
            btn.setAttribute(
              "aria-label",
              isPassword ? "Hide password" : "Show password",
            );
          });
        });

        function hideAlert() {
          formAlert.style.display = "none";
          formAlert.className = "alert";
          formAlert.textContent = "";
        }
        function showAlert(type, message) {
          formAlert.className = "alert alert-" + type;
          formAlert.textContent = message;
          formAlert.style.display = "flex";
        }
        function setError(el, msg) {
          el.classList.add("is-invalid");
          const fb =
            el.parentElement.parentElement.querySelector(".invalid-feedback");
          if (fb) fb.textContent = msg;
        }
        function clearErrors() {
          [currentEl, newEl, confirmEl].forEach(function (el) {
            el.classList.remove("is-invalid");
            const fb =
              el.parentElement.parentElement.querySelector(".invalid-feedback");
            if (fb) fb.textContent = "";
          });
          hideAlert();
        }
        [currentEl, newEl, confirmEl].forEach(function (el) {
          el.addEventListener("input", clearErrors);
        });

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          clearErrors();

          const current = currentEl.value;
          const next = newEl.value;
          const confirm = confirmEl.value;

          let ok = true;
          if (!current) {
            setError(currentEl, "Current password is required.");
            ok = false;
          }
          if (!next) {
            setError(newEl, "New password is required.");
            ok = false;
          } else if (next.length < 8) {
            setError(newEl, "New password must be at least 8 characters.");
            ok = false;
          }
          if (!confirm) {
            setError(confirmEl, "Please confirm your new password.");
            ok = false;
          } else if (next && confirm !== next) {
            setError(confirmEl, "Passwords do not match.");
            ok = false;
          }
          if (!ok) return;

          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2"></span> Updating...';

          try {
            const res = await API.post("/admin/change-password.php", {
              current_password: current,
              new_password: next,
              confirm_password: confirm,
            });

            if (res.success) {
              showAlert("success", "Password changed successfully.");
              form.reset();
            } else {
              showAlert("danger", res.message || "Unable to change password.");
              if (/current password/i.test(res.message || ""))
                setError(currentEl, res.message);
              else if (/at least 8/i.test(res.message || ""))
                setError(newEl, res.message);
              else if (/match/i.test(res.message || ""))
                setError(confirmEl, res.message);
            }
          } catch (err) {
            showAlert("danger", "Unable to connect. Please try again.");
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = "Change Password";
          }
        });

        API.requireAuth("admin");
      })();
    </script>
  </body>
</html>
